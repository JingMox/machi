[package]
name = "machi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Enterprise embeddable agent runtime kernel"
keywords = ["ai", "agent", "llm", "workflow", "runtime"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["runtime", "workflow"]
runtime = ["dep:machi-runtime", "dep:machi-agent", "dep:machi-llm", "dep:machi-tools"]
workflow = ["dep:machi-workflow"]
openai = ["runtime", "machi-llm/openai"]
ollama = ["runtime", "machi-llm/ollama"]
full = ["runtime", "workflow", "openai", "ollama"]

[dependencies]
machi-types = { workspace = true }
machi-tools = { workspace = true, optional = true }
machi-llm = { workspace = true, optional = true }
machi-agent = { workspace = true, optional = true }
machi-runtime = { workspace = true, optional = true }
machi-workflow = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }
tempfile = "3"
tokio-util = { workspace = true }

[lints]
workspace = true
