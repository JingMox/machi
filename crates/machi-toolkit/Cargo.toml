[package]
name = "machi-toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference filesystem and shell tools for the Machi kernel"
keywords = ["ai", "agent", "tools", "filesystem"]
categories = ["filesystem", "asynchronous"]

[features]
default = []
# macOS Seatbelt process sandbox (passthrough compile on other OSes).
seatbelt = ["machi-sandbox/seatbelt"]

[dependencies]
async-trait = { workspace = true }
machi-sandbox = { workspace = true }
machi-tools = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "macros", "rt", "time", "process"] }

[dev-dependencies]
machi-types = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
